<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro</h1>

    <form id="formRegistro">

        <!-- 1. Nombre completo -->
        <div>
            <label for="nombre">Nombre completo:</label><br>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                placeholder="Escribe tu nombre completo" 
                required
            >
        </div>
        <br>

        <!-- 2. Correo electrónico -->
        <div>
            <label for="correo">Correo electrónico:</label><br>
            <input 
                type="email" 
                id="correo" 
                name="correo" 
                placeholder="ejemplo@correo.com" 
                required
            >
        </div>
        <br>

        <!-- 3. Contraseña -->
        <div>
            <label for="password">Contraseña:</label><br>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Crea una contraseña" 
                required
            >
        </div>
        <br>

        <!-- 4. Edad -->
        <div>
            <label for="edad">Edad:</label><br>
            <input 
                type="number" 
                id="edad" 
                name="edad" 
                min="18" 
                max="100" 
                placeholder="18" 
                required
            >
        </div>
        <br>

        <!-- 5. Fecha de nacimiento -->
        <div>
            <label for="fechaNacimiento">Fecha de nacimiento:</label><br>
            <input 
                type="date" 
                id="fechaNacimiento" 
                name="fechaNacimiento" 
                required
            >
        </div>
        <br>

        <!-- 6. Género (Radio buttons) -->
        <div>
            <label>Género:</label><br>
            
            <input 
                type="radio" 
                id="masculino" 
                name="genero" 
                value="masculino" 
                required
            >
            <label for="masculino">Masculino</label><br>

            <input 
                type="radio" 
                id="femenino" 
                name="genero" 
                value="femenino"
            >
            <label for="femenino">Femenino</label><br>

            <input 
                type="radio" 
                id="otro" 
                name="genero" 
                value="otro"
            >
            <label for="otro">Otro</label>
        </div>
        <br>

        <!-- 7. Intereses (Checkboxes) -->
        <div>
            <label>Intereses:</label><br>

            <input 
                type="checkbox" 
                id="tecnologia" 
                name="intereses" 
                value="tecnologia"
            >
            <label for="tecnologia">Tecnología</label><br>

            <input 
                type="checkbox" 
                id="deportes" 
                name="intereses" 
                value="deportes"
            >
            <label for="deportes">Deportes</label><br>

            <input 
                type="checkbox" 
                id="arte" 
                name="intereses" 
                value="arte"
            >
            <label for="arte">Arte y Cultura</label>
        </div>
        <br>

        <!-- 8. Fotografía de perfil -->
        <div>
            <label for="fotoPerfil">Fotografía de perfil:</label><br>
            <input 
                type="file" 
                id="fotoPerfil" 
                name="fotoPerfil" 
                accept="image/*"
            >
        </div>
        <br>

        <!-- 9. Color favorito -->
        <div>
            <label for="colorFavorito">Color favorito:</label><br>
            <input 
                type="color" 
                id="colorFavorito" 
                name="colorFavorito" 
                value="#ff0000"
            >
        </div>
        <br>

        <!-- 10. Nivel de satisfacción -->
        <div>
            <label for="satisfaccion">Nivel de satisfacción (1 al 10):</label><br>
            <input 
                type="range" 
                id="satisfaccion" 
                name="satisfaccion" 
                min="1" 
                max="10" 
                value="5"
            >
        </div>
        <br>

        <!-- Botón de envío -->
        <button type="submit">Registrar</button>

    </form>

</body>
</html>
